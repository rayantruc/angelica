<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b2f77">
  <meta name="description" content="Pop glowing orbs with ripples, chain combos, and descend through Heaven, Purgatory, and Hell.">
  <title>Ripple Chain: Descent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" aria-label="Ripple Chain: Descent game">
    <canvas id="c" aria-label="Game board. Tap or click to create a ripple."></canvas>
    <div id="hud" aria-live="polite">
      <div class="pill" id="p1"><span class="dot" aria-hidden="true"></span><span id="pt">0/4</span></div>
      <div class="pill" id="lv">Heaven - Level 1</div>
      <div class="pill score-pill"><span id="dots" aria-hidden="true"></span><span id="sc">0</span></div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <section id="ov" aria-labelledby="t1">
      <div id="card">
        <h1 id="t1">Ripple Chain</h1>
        <p id="t2">Tap to trigger ripples. Chain the glowing orbs and descend from Heaven to the depths of Hell!</p>
        <div id="rl"></div>
<button id="t3" type="button">Play Game</button>
      </div>
    </section>
  </main>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
